# Number of independent sample traces to generate
num_samples = 64
# Batch size of sample generation. If not provided, we do a single batch
batch_size = 256
# Number of sampling steps to take
num_steps = 128

# Which model to load (ema, best, last) 
model_type = "ema"
# Output directory for generations.
out_dir = "samples/noTe"
# Whether samples in out_dir should be replaced or added to
replace_samples = true
# ODE method
method = "heun"

# Stochastic args
S_churn = 0.0       # Set the level of stochasticity (0 for none, >0 for more)
S_tmin = 0.05        # Minimum noise level for stochasticity to apply
S_tmax = 50        # Maximum noise level for stochasticity to apply
S_noise = 1.003     # Noise multiplier for stochasticity
noise_min = 0.002
noise_max = 80.0
step_exponent = 7.0

# "dps" uses moment-projected likelihood guidance; "constant" reproduces the paper sampler.
sampling_mode = "dps"

# Set true to average the empirical per-cell variances within each channel.
process_variance_channel_average = false
# Subtract the learned E[denoised - clean | t] from the denoised estimate.
process_bias_correction = true
process_bias_scale = 1.0
# Recompute guidance at both RK2 stages below this noise level.
guidance_second_order_below = inf

[observation]
base_sim = "mcmc_reference/ref_3charge/normalized"
error = {type = "relative", space = "unnormalized", stddev = 0.025}

[observation.measurements]
B = {locations = "all"}
ui_1 = {locations = "all"}
