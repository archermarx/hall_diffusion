[adapter]
name = "image"
base_checkpoint = "saved_models/unconditional/checkpoint.pth.tar"
base_weights = "ema"

[adapter.encoder]
type = "cnn2d"
in_channels = 1
channels = [64, 128, 256]
blocks_per_stage = 2
token_dim = 256

[adapter.condition]
type = "hdf5"
train_file = "data/train_conditions.h5"
test_file = "data/test_conditions.h5"
train_sorted_file = "data/train_conditions_sorted.h5"
test_sorted_file = "data/test_conditions_sorted.h5"
data_key = "condition"
id_key = "trace_uuid"
add_channel_dim = true
add_occupancy_channel = false
sort_batch_size = 256
transform = "none"

[training]
epochs = 128
batch_size = 64
eval_freq = 100
log_file = "training.csv"
load_workers = 2
ema_epochs = 16
ema_start_epochs = 0

[training.loss]
P_mean = -1.2
P_std = 1.2

[training.optimizer]
lr = 3e-4
adam_betas = [0.9, 0.999]

[training.directories]
out_dir = "saved_models/image_adapter"
train_data_dir = "data/train_21"
test_data_dir = "data/test_small"

[training.checkpoints]
load_checkpoint = true
checkpoint_save_freq = 100
