[adapter]
name = "tlpp"
# Replace this with the checkpoint of the frozen unconditional denoiser.
base_checkpoint = "saved_models/train_h9/checkpoint.pth.tar"
base_weights = "ema"

[adapter.encoder]
type = "tlpp_vae"
checkpoint = "vae_scratch/last.pt"
# Set false to fine-tune the VAE encoder and latent-mean head with diffusion loss.
freeze_vae = true
token_dim = 256
num_tokens = 4
hidden_dim = 256
depth = 2

[adapter.condition]
type = "hdf5"
# These files are already stored in base-UUID order and can be used directly.
train_sorted_file = "h9_batch3_train_TLPPs_compressed_sorted.h5"
test_sorted_file = "h9_batch3_val_small_TLPPs_compressed_sorted.h5"
data_key = "tlpp_counts"
id_key = "trace_uuid"
add_channel_dim = true
sort_batch_size = 256
# Raw counts are normalized and log01-transformed by the frozen VAE encoder.
# Cache deterministic VAE means in CPU memory during the first epoch. This
# requires freeze_vae = true and uses about 512 bytes per record.
cache_vae_means = true

[adapter.diagnostics]
type = "tlpp"
# Number of distinct, randomly selected validation records shown in each diagnostic figure.
examples = 6

[training]
epochs = 128
batch_size = 16
# Frequency in optimizer batches for validation and diagnostic plots.
eval_freq = 100
log_file = "training.csv"
load_workers = 4
prefetch_factor = 4
ema_epochs = 16
ema_start_epochs = 0
# CUDA float16 autocast with gradient scaling; ignored on non-CUDA devices.
use_amp = true
torch_compile = false

[training.loss]
P_mean = -1.2
P_std = 1.2

[training.optimizer]
lr = 3e-4
adam_betas = [0.9, 0.999]

[training.directories]
out_dir = "saved_models/tlpp_adapter"
train_data_dir = "h9_batch3_train.h5"
test_data_dir = "h9_batch3_val_small.h5"

[training.checkpoints]
# Resume from out_dir/adapter.pth.tar when it exists.
load_checkpoint = true
# Frequency in optimizer batches for saving. Set to -1 to disable.
checkpoint_save_freq = 100
