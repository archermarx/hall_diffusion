num_samples = 32
batch_size = 32
num_steps = 64
model_type = "ema"
out_dir = "samples/tlpp_adapter"
replace_samples = true
method = "midpoint"
unconditional_data_dir = "h9_batch3_val_small.h5"

[[adapters]]
name = "tlpp"
checkpoint = "saved_models/tlpp_adapter/adapter.pth.tar"
condition_file = "h9_batch3_val_small_TLPPs_compressed.h5"
condition_uuid = "replace-with-trace-uuid"
condition_data_key = "tlpp_counts"
condition_id_key = "trace_uuid"
condition_add_channel_dim = true
# Adapter residual strength; this is independent of VAE input normalization.
scale = 1.0
weights = "ema"
